protocol:
  path: research_protocols/zero_run_mechanical_null_audit_v1.md
data:
  tick_input_path: outputs/v2/tick/semantic_validation/raw_2y/intermediate/tick_micro_frame_15m.parquet
  zero_run_analysis_path: outputs/v2/zero_run_microstructure_v1/analysis_frame.parquet
  zero_run_scaler_path: outputs/v2/zero_run_microstructure_v1/scaling_artifact.json
  zero_run_mechanism_decisions_path: outputs/v2/zero_run_microstructure_v1/mechanism_decisions.csv
  expected_rows: 490560
  expected_oos_start: '2025-04-08T00:00:00Z'
  expected_oos_end_exclusive: '2026-04-08T00:00:00Z'
  symbols:
  - BTCUSDT
  - ETHUSDT
  - XRPUSDT
  - SOLUSDT
  - DOGEUSDT
  - ADAUSDT
  - AVAXUSDT
