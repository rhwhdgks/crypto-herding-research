  random_seed: 20260720
  stratification_quantiles: 5
  maximum_rows_per_asset_tx_zero_stratum: 80
  minimum_group_rows: 200
  fdr_alpha: 0.05
  null_fpr_lower_bound: 0.015
  null_fpr_upper_bound: 0.035
  null_fpr_group_maximum: 0.05
  minimum_calibrated_group_share: 0.9
  empirical_percentile_threshold: 0.95
  minimum_supporting_assets: 5
  mechanism_minimum_count: 3
  mechanism_minimum_magnitude_ratio: 0.5
  mechanism_independent_outcomes:
  - log_amihud_illiquidity
  - abs_aggressor_imbalance
  mechanism_outcomes:
  - log_amihud_illiquidity
  - zero_tick_share
  - log_mean_intertrade_ms
  - log_quote_volume
  - abs_aggressor_imbalance
  mechanism_controls:
  - abs_bucket_return
  - current_market_abs_return_loo
  fixed_effects:
