analysis:
  start: "2018-01-01"
  end: "2024-04-09"
  minimum_active_assets: 55
  minimum_asset_day_coverage: 0.95
  minimum_eligible_day_share: 0.99
  minimum_positive_price_share: 0.99
  variants:
    - name: replication_primary
      return_method: log
      market_cap_weighting: contemporaneous
    - name: no_lookahead_sensitivity
      return_method: log
      market_cap_weighting: lagged
  method_audit_variants:
    - {name: simple_contemporaneous, return_method: simple, market_cap_weighting: contemporaneous}
    - {name: simple_lagged, return_method: simple, market_cap_weighting: lagged}
    - {name: log_contemporaneous, return_method: log, market_cap_weighting: contemporaneous}
    - {name: log_lagged, return_method: log, market_cap_weighting: lagged}
  frequencies: [daily, weekly]
  regression:
    models: [standard_csad, no_intercept_csad, scsad]
    cov_type: HAC
    hac_maxlags: auto
    fdr_alpha: 0.05
    family_size_per_period_variant: 6
  subperiods:
    - {name: full_sample, start: "2018-01-01", end: "2024-04-09"}
    - {name: pre_covid, start: "2018-01-01", end: "2020-03-10"}
    - {name: covid, start: "2020-03-11", end: "2022-02-23"}
    - {name: post_covid, start: "2022-02-24", end: "2024-04-09"}

benchmark:
  citation: Natashekara and Sampath (2026), Tables 2, A.1, A.5
  values:
    - {period: full_sample, frequency: daily, model: no_intercept_csad, coefficient: -1.850, t_stat: -3.523, nobs: 2291}
    - {period: pre_covid, frequency: daily, model: no_intercept_csad, coefficient: -4.634, t_stat: -4.426, nobs: 800}
    - {period: covid, frequency: daily, model: no_intercept_csad, coefficient: -1.757, t_stat: -7.220, nobs: 715}
    - {period: post_covid, frequency: daily, model: no_intercept_csad, coefficient: -6.543, t_stat: -7.625, nobs: 776}
    - {period: full_sample, frequency: daily, model: scsad, coefficient: -2.924, t_stat: -4.471, nobs: 2291}
    - {period: pre_covid, frequency: daily, model: scsad, coefficient: -14.892, t_stat: -3.209, nobs: 800}
    - {period: covid, frequency: daily, model: scsad, coefficient: -4.807, t_stat: -6.006, nobs: 715}
    - {period: post_covid, frequency: daily, model: scsad, coefficient: -30.813, t_stat: -7.546, nobs: 776}
    - {period: full_sample, frequency: weekly, model: standard_csad, coefficient: -0.115, t_stat: -0.405, nobs: 307}
    - {period: full_sample, frequency: weekly, model: no_intercept_csad, coefficient: -2.096, t_stat: -5.904, nobs: 307}
    - {period: full_sample, frequency: weekly, model: scsad, coefficient: -3.359, t_stat: -3.632, nobs: 307}

