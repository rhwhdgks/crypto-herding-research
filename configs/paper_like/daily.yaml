data:
  source: binance
  prefer_local_files: true
  local_data_dir: data
  cache_downloads: true
  cache_format: parquet
  use_bulk_downloads: false
  fallback_to_mock: false
  symbols:
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
    - XRPUSDT
    - ADAUSDT
    - SOLUSDT
    - DOGEUSDT
    - LINKUSDT
    - AVAXUSDT
    - DOTUSDT
    - LTCUSDT
    - TRXUSDT
    - ATOMUSDT
    - NEARUSDT
  timeframe: 1d
  start: "2018-01-01 00:00:00"
  end: "2024-04-09 00:00:00"
  exchange_limit: 1000
  missing_timestamp_policy: none
  allow_partial_history: true

panel:
  mode: expanding_universe
  min_active_assets: 4

paper_like:
  regression:
    cov_type: HAC
    hac_maxlags: auto
  subperiods:
    - name: pre_covid
      start: "2018-01-01 00:00:00"
      end: "2020-03-10 23:59:00"
    - name: covid
      start: "2020-03-11 00:00:00"
      end: "2022-02-23 23:59:00"
    - name: post_covid
      start: "2022-02-24 00:00:00"
      end: "2024-04-08 23:59:00"

database:
  enabled: false

output:
  base_dir: outputs/paper_like/daily

logging:
  level: INFO
