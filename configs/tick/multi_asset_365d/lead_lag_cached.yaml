data:
  source: binance_public_data
  trade_kind: aggTrades
  local_data_dir: data/tick_archive
  overwrite_existing: false
  prefer_monthly_archives: true
  monthly_chunk_rows: 1000000
  symbols:
    - XRPUSDT
    - ETHUSDT
    - SOLUSDT
  lookback_days: 365
  end: latest

analysis:
  interval_minutes:
    - 15
  forward_horizons_minutes:
    - 30
  session_hours_utc:
    - 16
    - 17
    - 18
    - 19
    - 20
    - 21
    - 22
    - 23
  lookback_days_for_threshold: 5
  run_clustering_score_percentile: 0.15
  min_trades_per_bucket: 200
  leader_symbols:
    - ETHUSDT
    - SOLUSDT
  target_symbol: XRPUSDT

research:
  cached_micro_frame_path: outputs/v2/tick/multi_asset_365d/generalization/intermediate/tick_micro_frame_15m.csv

output:
  base_dir: outputs/v2/tick/multi_asset_365d/lead_lag

logging:
  level: INFO
