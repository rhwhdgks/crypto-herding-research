data:
  source: binance_public_data
  trade_kind: aggTrades
  local_data_dir: data/tick_archive
  overwrite_existing: false
  prefer_monthly_archives: true
  monthly_chunk_rows: 1000000
  symbols:
    - BTCUSDT
    - ETHUSDT
    - XRPUSDT
    - SOLUSDT
    - DOGEUSDT
    - ADAUSDT
    - AVAXUSDT
  start: "2025-05-08"
  end: "2026-05-07"

backfill:
  max_workers: 4

analysis:
  interval_minutes:
    - 15
  forward_horizons_minutes:
    - 30
  session_hours_utc:
    - 16
    - 17
    - 18
    - 19
    - 20
    - 21
    - 22
    - 23
  lookback_days_for_threshold: 5
  run_clustering_score_percentile: 0.15
  min_trades_per_bucket: 200
  min_inference_events: 30
  min_inference_unique_days: 20
  symbols:
    - BTCUSDT
    - ETHUSDT
    - XRPUSDT
    - SOLUSDT
    - DOGEUSDT
    - ADAUSDT
    - AVAXUSDT
  flat_return_epsilon: 0.0
  aggressor_balance_epsilon: 0.0
  event_filter:
    run_clustering_side:
      - up
      - down
      - zero
    price_direction:
      - up
      - down
  multiple_testing_family:
    leaders: [BTCUSDT, ETHUSDT, XRPUSDT, SOLUSDT, DOGEUSDT, ADAUSDT, AVAXUSDT]
    targets: [BTCUSDT, ETHUSDT, XRPUSDT, SOLUSDT, DOGEUSDT, ADAUSDT, AVAXUSDT]
    price_directions: [up, down]
    run_clustering_sides: [up, down, zero]
    horizons_minutes: [30]
    sessions: [16, 17, 18, 19, 20, 21, 22, 23]

research:
  cached_micro_frame_path: outputs/v2/tick/multi_asset_365d/lead_lag_matrix/intermediate/tick_micro_frame_15m.csv

output:
  base_dir: outputs/v2/tick/multi_asset_365d/lead_lag_matrix

logging:
  level: INFO
